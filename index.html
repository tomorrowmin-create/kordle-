<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>보드게임 꼬들</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#121213;color:#fff;font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  /* 시작 화면 */
  #start-screen{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:16px;}
  .start-title{font-size:2rem;font-weight:900;text-align:center;}
  .start-sub{font-size:0.8rem;color:#818384;text-align:center;margin-bottom:8px;}
  .diff-btn{width:100%;border:none;border-radius:10px;padding:18px 24px;cursor:pointer;font-family:inherit;font-weight:900;font-size:1rem;display:flex;justify-content:space-between;align-items:center;transition:filter 0.15s;}
  .diff-btn:active{filter:brightness(0.85);}
  .diff-btn .label{font-size:1.1rem;}
  .diff-btn .desc{font-size:0.72rem;opacity:0.8;font-weight:700;}
  .easy{background:#538d4e;color:#fff;}
  .normal{background:#b59f3b;color:#fff;}
  .hard{background:#c0392b;color:#fff;}
  /* 게임 화면 */
  #game-screen{width:100%;max-width:500px;display:none;flex-direction:column;align-items:center;min-height:100vh;}
  .header{width:100%;border-bottom:1px solid #3a3a3c;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
  .header h1{font-size:1.2rem;font-weight:900;}
  .back-btn{background:none;border:1px solid #3a3a3c;border-radius:4px;color:#818384;cursor:pointer;font-size:0.72rem;padding:4px 10px;font-family:inherit;}
  .diff-badge{font-size:0.65rem;padding:3px 8px;border-radius:10px;font-weight:700;}
  .badge-easy{background:#538d4e;}
  .badge-normal{background:#b59f3b;}
  .badge-hard{background:#c0392b;}
  .msg-box{height:36px;display:flex;align-items:center;justify-content:center;}
  .msg{background:#fff;color:#121213;padding:5px 14px;border-radius:4px;font-size:0.8rem;font-weight:700;animation:fadeDown 0.2s ease;}
  #grid{display:flex;flex-direction:column;gap:4px;padding:0 8px;}
  .row{display:flex;gap:4px;}
  .cell{border:2px solid #3a3a3c;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;}
  .cell.filled{border-color:#999;}
  .cell.correct{background:#538d4e;border-color:#538d4e;}
  .cell.present{background:#b59f3b;border-color:#b59f3b;}
  .cell.absent{background:#3a3a3c;border-color:#3a3a3c;}
  .result-box{background:#1a1a1b;border:1px solid #3a3a3c;border-radius:8px;padding:16px 24px;text-align:center;margin:12px 0;max-width:300px;width:90%;animation:fadeDown 0.3s ease;}
  .result-word{color:#538d4e;font-size:1.2rem;font-weight:900;margin-top:4px;}
  .result-btns{display:flex;gap:8px;margin-top:12px;}
  .restart-btn{flex:1;background:#538d4e;color:#fff;border:none;border-radius:6px;padding:10px 0;cursor:pointer;font-weight:700;font-size:0.85rem;font-family:inherit;}
  .menu-btn{flex:1;background:#2a2a2c;color:#fff;border:none;border-radius:6px;padding:10px 0;cursor:pointer;font-weight:700;font-size:0.85rem;font-family:inherit;}
  #keyboard{width:100%;max-width:500px;padding:8px;display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-bottom:16px;}
  .kb-row{display:flex;gap:5px;justify-content:center;}
  .key{border:none;border-radius:4px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:1rem;color:#fff;display:flex;align-items:center;justify-content:center;height:50px;background:#818384;transition:background 0.25s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  .key:active{filter:brightness(0.8);}
  .key.correct{background:#538d4e;}
  .key.present{background:#b59f3b;}
  .key.absent{background:#3a3a3c;}
  .key-wide{width:52px;font-size:0.68rem;}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}15%,45%,75%{transform:translateX(-5px)}30%,60%,90%{transform:translateX(5px)}}
</style>
</head>
<body>

<!-- 시작 화면 -->
<div id="start-screen">
  <div style="font-size:2.5rem">🎲</div>
  <div class="start-title">보드게임 꼬들</div>
  <div class="start-sub">난이도를 선택하세요</div>
  <button class="diff-btn easy" onclick="startGame('easy')">
    <span class="label">😊 쉬움</span>
    <span class="desc">6칸 이하</span>
  </button>
  <button class="diff-btn normal" onclick="startGame('normal')">
    <span class="label">🤔 보통</span>
    <span class="desc">7 ~ 10칸</span>
  </button>
  <button class="diff-btn hard" onclick="startGame('hard')">
    <span class="label">🔥 어려움</span>
    <span class="desc">10칸 이상</span>
  </button>
</div>

<!-- 게임 화면 -->
<div id="game-screen">
  <div class="header">
    <h1>🎲 보드게임 꼬들</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="diff-badge" class="diff-badge"></span>
      <button class="back-btn" onclick="goMenu()">메뉴</button>
    </div>
  </div>
  <div class="msg-box"><div id="msg" class="msg" style="display:none"></div></div>
  <div id="grid"></div>
  <div id="result-box" class="result-box" style="display:none">
    <div id="result-emoji" style="font-size:1.5rem"></div>
    <div id="result-title" style="font-weight:900;margin-top:6px"></div>
    <div id="result-word" class="result-word"></div>
    <div class="result-btns">
      <button class="restart-btn" onclick="restart()">다시 하기</button>
      <button class="menu-btn" onclick="goMenu()">메뉴</button>
    </div>
  </div>
  <div id="keyboard"></div>
</div>

<script>
const CHO  = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const JUNG = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
const JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const COMPOUND = {"ㅘ":["ㅗ","ㅏ"],"ㅙ":["ㅗ","ㅐ"],"ㅚ":["ㅗ","ㅣ"],"ㅝ":["ㅜ","ㅓ"],"ㅞ":["ㅜ","ㅔ"],"ㅟ":["ㅜ","ㅣ"],"ㅢ":["ㅡ","ㅣ"],"ㅒ":["ㅑ","ㅣ"],"ㅖ":["ㅕ","ㅣ"],"ㄳ":["ㄱ","ㅅ"],"ㄵ":["ㄴ","ㅈ"],"ㄶ":["ㄴ","ㅎ"],"ㄺ":["ㄹ","ㄱ"],"ㄻ":["ㄹ","ㅁ"],"ㄼ":["ㄹ","ㅂ"],"ㄽ":["ㄹ","ㅅ"],"ㄾ":["ㄹ","ㅌ"],"ㄿ":["ㄹ","ㅍ"],"ㅀ":["ㄹ","ㅎ"],"ㅄ":["ㅂ","ㅅ"],"ㄲ":["ㄱ","ㄱ"],"ㄸ":["ㄷ","ㄷ"],"ㅃ":["ㅂ","ㅂ"],"ㅆ":["ㅅ","ㅅ"],"ㅉ":["ㅈ","ㅈ"]};
const KB_ROWS = [["ㅂ","ㅈ","ㄷ","ㄱ","ㅅ","ㅛ","ㅕ","ㅑ","ㅐ","ㅔ"],["ㅁ","ㄴ","ㅇ","ㄹ","ㅎ","ㅗ","ㅓ","ㅏ","ㅣ"],["ㅋ","ㅌ","ㅊ","ㅍ","ㅠ","ㅜ","ㅡ"]];

function decompose(str) {
  const r = [];
  for (const c of str) {
    if (c === " ") continue; // 공백 무시
    const code = c.charCodeAt(0) - 0xAC00;
    if (code < 0 || code > 11171) { r.push(c); continue; }
    const cho=CHO[Math.floor(code/28/21)], jung=JUNG[Math.floor((code/28)%21)], jong=JONG[code%28];
    r.push(cho);
    if (COMPOUND[jung]) r.push(...COMPOUND[jung]); else r.push(jung);
    if (jong) { if (COMPOUND[jong]) r.push(...COMPOUND[jong]); else r.push(jong); }
  }
  return r;

// 난이도별 단어 분류
const WORDS = { easy:[], normal:[], hard:[] };
ALL_WORDS.forEach(w => {
  const len = decompose(w).length;
  if (len <= 6) WORDS.easy.push(w);
  else if (len <= 10) WORDS.normal.push(w);
  else WORDS.hard.push(w);
});

const MAX_TRIES = 6;
const DIFF_LABEL = { easy:"😊 쉬움", normal:"🤔 보통", hard:"🔥 어려움" };
const DIFF_CLASS  = { easy:"badge-easy", normal:"badge-normal", hard:"badge-hard" };
let currentDiff, wordData, answerJamo, jamoLen, guesses, current, status, keyColors;

function pickWord(diff) { const l=WORDS[diff]; return l[Math.floor(Math.random()*l.length)]; }

function evaluate(guess, answer) {
  const res=Array(guess.length).fill(null), pool=[...answer];
  guess.forEach((j,i)=>{if(j===answer[i]){res[i]={char:j,state:"correct"};pool[i]=null;}});
  guess.forEach((j,i)=>{
    if(res[i])return;
    const fi=pool.indexOf(j);
    if(fi!==-1){res[i]={char:j,state:"present"};pool[fi]=null;}
    else res[i]={char:j,state:"absent"};
  });
  return res;
}

function startGame(diff) {
  currentDiff = diff;
  document.getElementById("start-screen").style.display = "none";
  const gs = document.getElementById("game-screen");
  gs.style.display = "flex";
  const badge = document.getElementById("diff-badge");
  badge.textContent = DIFF_LABEL[diff];
  badge.className = "diff-badge " + DIFF_CLASS[diff];
  initGame();
}

function goMenu() {
  document.getElementById("game-screen").style.display = "none";
  document.getElementById("start-screen").style.display = "flex";
}

function initGame() {
  wordData   = pickWord(currentDiff);
  answerJamo = decompose(wordData);
  jamoLen    = answerJamo.length;
  guesses=[]; current=[]; status="playing"; keyColors={};
  document.getElementById("result-box").style.display="none";
  renderGrid(); renderKeyboard();
}

function restart() { initGame(); }

function cellSize() {
  return Math.min(42, Math.floor((Math.min(400,window.innerWidth)-16-(jamoLen-1)*4)/jamoLen));
}

function renderGrid() {
  const grid=document.getElementById("grid"); grid.innerHTML="";
  const cs=cellSize(), fs=cs>34?"0.85rem":cs>24?"0.7rem":"0.55rem";
  for(let r=0;r<MAX_TRIES;r++){
    const row=document.createElement("div"); row.className="row"; row.id="row-"+r;
    for(let c=0;c<jamoLen;c++){
      const cell=document.createElement("div"); cell.className="cell"; cell.id=`cell-${r}-${c}`;
      cell.style.cssText=`width:${cs}px;height:${cs}px;font-size:${fs};`;
      row.appendChild(cell);
    }
    grid.appendChild(row);
  }
}

function updateGrid() {
  const ri=guesses.length;
  guesses.forEach((guess,r)=>{ guess.forEach((g,c)=>{ const cell=document.getElementById(`cell-${r}-${c}`); cell.className=`cell ${g.state}`; cell.textContent=g.char; }); });
  if(status==="playing"){ for(let c=0;c<jamoLen;c++){ const cell=document.getElementById(`cell-${ri}-${c}`); if(!cell)continue; cell.className=current[c]?"cell filled":"cell"; cell.textContent=current[c]||""; } }
}

function renderKeyboard() {
  const kb=document.getElementById("keyboard"); kb.innerHTML="";
  const kw=Math.min(36,Math.floor((Math.min(400,window.innerWidth)-80)/10));
  KB_ROWS.forEach((row,ri)=>{
    const rowEl=document.createElement("div"); rowEl.className="kb-row";
    if(ri===2){const b=document.createElement("button");b.className="key key-wide";b.textContent="입력";b.onclick=submitGuess;rowEl.appendChild(b);}
    row.forEach(k=>{const b=document.createElement("button");b.className=`key ${keyColors[k]||""}`;b.style.width=kw+"px";b.textContent=k;b.id="key-"+k;b.onclick=()=>addJamo(k);rowEl.appendChild(b);});
    if(ri===2){const b=document.createElement("button");b.className="key key-wide";b.textContent="←";b.onclick=delJamo;rowEl.appendChild(b);}
    kb.appendChild(rowEl);
  });
}

function updateKeyboard() {
  const p={correct:3,present:2,absent:1};
  guesses[guesses.length-1].forEach(({char,state})=>{ if((p[state]||0)>(p[keyColors[char]]||0))keyColors[char]=state; });
  Object.entries(keyColors).forEach(([k,s])=>{ const el=document.getElementById("key-"+k); if(el)el.className=`key ${s}`; });
}

function addJamo(j){if(status!=="playing"||current.length>=jamoLen)return;current.push(j);updateGrid();}
function delJamo(){if(current.length>0){current.pop();updateGrid();}}

function showMsg(text){
  const el=document.getElementById("msg");
  el.textContent=text;el.style.display="block";el.style.animation="none";void el.offsetWidth;el.style.animation="fadeDown 0.2s ease";
  setTimeout(()=>{el.style.display="none";},1200);
}

function shakeRow(){
  const row=document.getElementById("row-"+guesses.length);
  if(!row)return; row.style.animation="none";void row.offsetWidth;row.style.animation="shake 0.5s ease";
}

function submitGuess(){
  if(status!=="playing")return;
  if(current.length!==jamoLen){showMsg(jamoLen+"칸을 채워주세요");shakeRow();return;}
  const result=evaluate(current,answerJamo);
  guesses.push(result);current=[];
  updateGrid();updateKeyboard();
  if(result.every(x=>x.state==="correct")){status="win";showResult();}
  else if(guesses.length>=MAX_TRIES){status="lose";showResult();}
}

function showResult(){
  document.getElementById("result-emoji").textContent=status==="win"?"🎉":"😞";
  document.getElementById("result-title").textContent=status==="win"?`${guesses.length}/${MAX_TRIES} 성공`:"실패";
  document.getElementById("result-word").textContent=wordData;
  document.getElementById("result-box").style.display="block";
}

document.addEventListener("keydown",e=>{
  if(document.getElementById("game-screen").style.display==="none")return;
  if(e.key==="Enter")submitGuess();
  else if(e.key==="Backspace")delJamo();
});
</script>
</body>
</html>
